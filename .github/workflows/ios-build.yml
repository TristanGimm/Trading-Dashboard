name: iOS build
on:
  push:
    branches: [main]
    paths: ['gimm-ios/**', '.github/workflows/ios-build.yml']
  pull_request:
    paths: ['gimm-ios/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone simulator app
        run: >-
          xcodebuild -project gimm-ios/GIMM.xcodeproj -scheme GIMM
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Release-iphonesimulator/GIMM.app build/GIMM-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GIMM-iOS-Simulator
          path: build/GIMM-Simulator.zip
          if-no-files-found: error
          retention-days: 14
